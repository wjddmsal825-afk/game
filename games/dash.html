<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: full-bleed canvas city run; HUD painted on canvas, menus float as DOM overlays. Single neon-dusk look by choice. */
:root{
  --ink:#081226;
  --paper:#f3f6ff;
  --signal:#ffcf3f;
  --hot:#ff3d6e;
  --cool:#3de0ff;
  --violet:#9b5cff;
  --lime:#b6ff3d;
  --ember:#ff8a3d;
  --muted:rgba(243,246,255,.62);
  --display:'Bungee','Impact','Arial Black',system-ui,sans-serif;
  --ui:'Chakra Petch','Avenir Next','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--ui);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:relative;width:100%;height:100%;overflow:hidden;background:var(--ink)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

.home{position:absolute;z-index:20;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));
  font:700 14px var(--ui);letter-spacing:.06em;color:var(--paper);text-decoration:none;padding:8px 13px;border:1px solid rgba(243,246,255,.3);
  background:rgba(8,18,38,.55);border-radius:6px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:all .25s ease}
.home:hover{border-color:var(--signal);color:var(--signal)}
.home:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
.home.mini{font-size:11px;padding:5px 8px;opacity:.72}

.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding-block:56px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  text-align:center;background:radial-gradient(ellipse at 50% 45%,rgba(8,18,38,.05),rgba(8,18,38,.78));animation:fadeIn .4s ease both;overflow:hidden}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.eyebrow{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--cool);font-weight:700}
.logo-wrap{position:relative;padding:0 24px}
.logo{font-family:var(--display);font-size:clamp(64px,19vw,150px);line-height:.9;margin:0;white-space:nowrap;transform:skewX(-10deg)}
.logo span{display:inline-block;background:linear-gradient(180deg,#fff 6%,var(--lime) 45%,var(--cool) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 5px 0 rgba(4,10,24,.6)) drop-shadow(-8px 0 0 rgba(255,61,110,.55));
  animation:zoomIn .7s cubic-bezier(.2,1.4,.4,1) both, lean 1.6s ease-in-out infinite;
  animation-delay:calc(var(--i)*80ms), calc(var(--i)*120ms + .9s)}
@keyframes zoomIn{from{transform:translateX(70vw) skewX(-40deg) scaleX(1.8);opacity:0}to{transform:none;opacity:1}}
@keyframes lean{0%,100%{transform:translateX(0)}50%{transform:translateX(6px) translateY(-4px)}}
.streaks{position:absolute;inset:-10px -40px;pointer-events:none;z-index:-1}
.streaks i{position:absolute;right:0;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--c,#fff));opacity:0;animation:streak 1.1s linear infinite}
@keyframes streak{0%{transform:translateX(30%);opacity:0;width:20%}20%{opacity:.85}100%{transform:translateX(-160%);opacity:0;width:60%}}
.tag{max-width:34ch;margin:0;color:var(--muted);font-size:15px;line-height:1.5;text-wrap:balance}

.btn{font-family:var(--display);font-size:20px;letter-spacing:.04em;color:var(--ink);background:var(--lime);border:0;cursor:pointer;
  padding:16px 38px;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);position:relative;overflow:hidden;
  transition:transform .15s ease, background .15s ease}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.75) 48%,transparent 66%);transform:translateX(-120%);animation:shine 2.6s ease-in-out infinite 1.2s}
@keyframes shine{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.btn:hover{transform:translateY(-2px) scale(1.04);background:#d4ff86}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid var(--cool);outline-offset:4px}

.keys{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;max-width:560px;font-size:13px;color:var(--muted)}
.keys b{display:inline-block;min-width:22px;padding:2px 7px;margin-right:4px;border:1px solid rgba(243,246,255,.28);border-bottom-width:3px;border-radius:4px;color:var(--paper);font-weight:600;font-size:12px}
.best{font-size:13px;letter-spacing:.2em;color:var(--signal);font-variant-numeric:tabular-nums}

#over h2{font-family:var(--display);font-size:clamp(38px,10vw,72px);margin:0;color:var(--hot);letter-spacing:.02em;transform:skewX(-8deg);animation:slam .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slam{from{transform:scale(2.4) skewX(-8deg);opacity:0;filter:blur(6px)}to{transform:skewX(-8deg);opacity:1;filter:none}}
.score-big{font-family:var(--display);font-size:clamp(40px,11vw,76px);color:var(--paper);font-variant-numeric:tabular-nums;line-height:1}
.newrec{font-weight:700;letter-spacing:.24em;font-size:13px;color:var(--ink);background:var(--lime);padding:5px 12px;animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.stats{display:flex;gap:26px;font-size:13px;color:var(--muted);letter-spacing:.12em}
.stats strong{display:block;font-size:22px;color:var(--paper);letter-spacing:0;font-variant-numeric:tabular-nums}

#banner{position:absolute;left:0;right:0;top:26%;pointer-events:none;text-align:center;opacity:0}
#banner.show{animation:bannerLife 2.5s ease both}
#banner .b-main{font-family:var(--display);font-size:clamp(36px,10vw,78px);color:var(--paper);text-shadow:0 4px 0 rgba(4,10,24,.6),-5px 0 0 rgba(255,61,110,.5);white-space:nowrap;transform:skewX(-8deg)}
#banner .b-main span{display:inline-block;animation:letterIn .5s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i)*45ms)}
#banner .b-sub{font-weight:700;letter-spacing:.3em;font-size:14px;color:var(--lime);margin-top:6px}
#banner::before,#banner::after{content:"";display:block;height:3px;margin:10px auto;background:linear-gradient(90deg,transparent,var(--lime),transparent);animation:stretch .7s ease both .1s}
@keyframes stretch{from{width:0}to{width:min(520px,80%)}}
@keyframes letterIn{from{transform:translateX(80px) skewX(-30deg);opacity:0}to{transform:none;opacity:1}}
@keyframes bannerLife{0%{opacity:0;transform:translateX(-40px)}8%{opacity:1;transform:none}82%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-80px)}}
#banner.phase .b-main{color:var(--signal)}

#hudBtns{position:absolute;inset:0;pointer-events:none}
.hb{pointer-events:auto;position:absolute;top:calc(12px + env(safe-area-inset-top,0px));height:32px;min-width:42px;padding:0 9px;border-radius:6px;font-size:12px;letter-spacing:.08em;
  border:1px solid rgba(243,246,255,.3);background:rgba(8,18,38,.45);color:var(--paper);font-family:var(--ui);font-weight:700;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.hb:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
#pauseBtn{right:calc(12px + env(safe-area-inset-right,0px))}
#muteBtn{right:calc(60px + env(safe-area-inset-right,0px))}
#pause h2{font-family:var(--display);font-size:44px;margin:0}

@media (prefers-reduced-motion: reduce){
  .logo span,.btn::after,#banner .b-main span,.newrec,.streaks i{animation:none!important}
  .streaks{display:none}
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" aria-label="게임 화면"></canvas>
  <div id="banner"></div>
  <a class="home" id="home" href="../index.html">◀ 홈</a>

  <div id="hudBtns" hidden>
    <button class="hb" id="muteBtn" aria-label="소리 끄기">SND</button>
    <button class="hb" id="pauseBtn" aria-label="일시정지">II</button>
  </div>

  <div id="menu" class="overlay">
    <div class="eyebrow">Neon Rooftop Run · 끝없는 질주</div>
    <div class="logo-wrap">
      <div class="streaks" aria-hidden="true"></div>
      <h1 class="logo" aria-label="Dash"></h1>
    </div>
    <p class="tag">해가 지고 네온이 켜지는 도시를 멈추지 않고 달리세요. 장애물을 넘고, 미끄러지고, 코인을 쓸어 담으세요.</p>
    <button class="btn" id="startBtn">달리기 시작</button>
    <div class="keys">
      <span><b>Space</b>/<b>↑</b>/<b>탭</b> 점프 (2단)</span>
      <span><b>↓</b>/<b>S</b>/<b>아래 스와이프</b> 슬라이드</span>
      <span><b>P</b> 일시정지</span>
    </div>
    <div class="best" id="bestLbl"></div>
  </div>

  <div id="pause" class="overlay" hidden>
    <h2>PAUSED</h2>
    <button class="btn" id="resumeBtn">계속 달리기</button>
  </div>

  <div id="over" class="overlay" hidden>
    <div class="eyebrow" id="overWhy">충돌했습니다</div>
    <h2>WIPE OUT</h2>
    <div class="score-big" id="overScore">0</div>
    <div class="newrec" id="newRec" hidden>NEW RECORD</div>
    <div class="stats">
      <div>거리<strong id="overDist">0m</strong></div>
      <div>코인<strong id="overCoins">0</strong></div>
      <div>최고 기록<strong id="overBest">0</strong></div>
    </div>
    <button class="btn" id="retryBtn">다시 달리기</button>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('cv'), g = cv.getContext('2d');
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const BEST_KEY = 'arcade-best-dash';

/* ---------------- logo ---------------- */
document.querySelector('.logo').innerHTML = [...'DASH'].map((c, i) => `<span style="--i:${i}">${c}</span>`).join('');
document.querySelector('.streaks').innerHTML = Array.from({ length: 9 }, (_, i) =>
  `<i style="top:${8 + i * 10}%;animation-delay:${(i * .37) % 1.1}s;--c:${['#3de0ff', '#ff3d6e', '#b6ff3d', '#fff'][i % 4]}"></i>`).join('');

/* ---------------- audio ---------------- */
const S = {
  ctx: null, m: null, muted: store.get('arcade-dash-muted', '0') === '1', lc: 0,
  init() {
    if (this.ctx) { this.ctx.resume && this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = new AC(); this.m = this.ctx.createGain(); this.m.gain.value = .3; this.m.connect(this.ctx.destination);
      const sr = this.ctx.sampleRate; this.nb = this.ctx.createBuffer(1, sr * 1.5, sr);
      const d = this.nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  ok() { return this.ctx && !this.muted; },
  tone(f, dur, type = 'square', vol = .1, f2 = null, delay = 0) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime + delay, o = c.createOscillator(), gn = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(gn); gn.connect(this.m); o.start(t); o.stop(t + dur + .02);
  },
  noise(dur, vol, f1, f2) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime, s = c.createBufferSource(); s.buffer = this.nb;
    const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.setValueAtTime(f1, t); fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const gn = c.createGain(); gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(fl); fl.connect(gn); gn.connect(this.m); s.start(t); s.stop(t + dur);
  },
  jump() { this.tone(300, .15, 'square', .05, 700); },
  djump() { this.tone(520, .16, 'square', .05, 1250); this.tone(1560, .14, 'triangle', .04, null, .05); },
  land() { this.noise(.09, .12, 900, 120); },
  slide() { this.noise(.32, .12, 3200, 300); },
  coin(n) { const now = performance.now(); if (now - this.lc < 28) return; this.lc = now; const f = 990 * Math.pow(2, Math.min(n, 14) / 12); this.tone(f, .09, 'triangle', .07); this.tone(f * 1.5, .12, 'triangle', .045, null, .045); },
  pick() { [660, 880, 1320, 1760].forEach((f, i) => this.tone(f, .12, 'triangle', .08, null, i * .05)); },
  shieldBreak() { this.tone(900, .28, 'triangle', .1, 180); this.noise(.3, .22, 5000, 400); },
  crash() { this.tone(220, .6, 'sawtooth', .13, 40); this.noise(.8, .42, 3000, 50); this.tone(90, .55, 'sine', .25, 28); },
  mile() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .2, 'square', .045, null, i * .09)); }
};

/* ---------------- palettes (day → sunset → night → dawn) ---------------- */
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const PAL_SRC = [
  { name: '한낮의 질주', top: '#2a7bff', mid: '#6cc4ff', bot: '#ffe6b5', sun: '#fff1c2', sunY: .26, sunR: 34, bands: 0, mount: '#86aee0', far: '#6a90c8', mid2: '#40609a', near: '#24365e', ground: '#1b2544', edge: '#3de0ff', haze: '#ffe8c8', cloud: '#ffffff', win: .06, stars: 0, neon: .2 },
  { name: '노을 구간', top: '#3b2a7a', mid: '#ff5f7c', bot: '#ffb347', sun: '#ffb070', sunY: .74, sunR: 52, bands: 1, mount: '#93507f', far: '#6e3668', mid2: '#47224f', near: '#2a1436', ground: '#1d1029', edge: '#ff8a3d', haze: '#ff9a7a', cloud: '#ffb8b0', win: .55, stars: .12, neon: .7 },
  { name: '네온의 밤', top: '#04060f', mid: '#121a46', bot: '#3c2468', sun: '#dfe8ff', sunY: .2, sunR: 24, bands: 0, mount: '#1b2048', far: '#171b3e', mid2: '#10132e', near: '#0a0c1f', ground: '#0a0d1d', edge: '#9b5cff', haze: '#5a3a9a', cloud: '#5a6498', win: 1, stars: 1, neon: 1 },
  { name: '새벽 돌파', top: '#25316f', mid: '#b86aa6', bot: '#ffc78c', sun: '#ffd0a0', sunY: .66, sunR: 40, bands: .5, mount: '#5d5c98', far: '#4c4c86', mid2: '#33366c', near: '#1f2249', ground: '#161b35', edge: '#ffcf3f', haze: '#ffb8a0', cloud: '#ffd6cc', win: .35, stars: .35, neon: .5 }
];
const PALS = PAL_SRC.map(p => { const o = {}; for (const k in p) o[k] = typeof p[k] === 'string' && p[k][0] === '#' ? hex(p[k]) : p[k]; return o; });
const PHASE_M = 400;
const rgb = a => `rgb(${a[0] | 0},${a[1] | 0},${a[2] | 0})`;
const rgba = (a, al) => `rgba(${a[0] | 0},${a[1] | 0},${a[2] | 0},${al})`;
let pal = PALS[0];
function blendPal(m) {
  const ph = m / PHASE_M, i = Math.floor(ph) % 4, f = ph - Math.floor(ph);
  const k = clamp((f - .62) / .38, 0, 1), t = k * k * (3 - 2 * k);
  const A = PALS[i], B = PALS[(i + 1) % 4], o = {};
  for (const key in A) {
    const a = A[key], b = B[key];
    if (Array.isArray(a)) o[key] = [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
    else if (typeof a === 'number') o[key] = lerp(a, b, t);
    else o[key] = t < .5 ? a : b;
  }
  return o;
}

/* ---------------- state ---------------- */
let W = 0, H = 0, DPR = 1, Z = 1, VW = 0, VH = 0, GY = 0, clock = 0;
let state = 'menu', best = +store.get(BEST_KEY, 0) || 0;
let speed = 320, scroll = 0, dist = 0, cycleM = 0, runT = 0, coinsN = 0, score = 0, dispScore = 0;
let obs = [], gaps = [], coins = [], pks = [], parts = [], lines = [];
let nextSpawn = 600, coinStreak = 0, coinStreakT = 0, mileNext = 250, phaseShown = 0, menuJumpT = 1.5, menuCoinT = 1;
let shakeAmt = 0, flashA = 0, flashCol = '255,255,255', hitstop = 0, ts = 1, tsTarget = 1, deadT = 0, overAt = 0;
let P = null, rag = null, bannerQ = [], bannerCD = 0;
const sky = { far: null, mid: null, stars: [], clouds: [] };
const GRAV = 2700, JV = 880, DJV = 770;
const playerX = () => clamp(VW * .24, 120, 300);

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const r = cv.getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  Z = clamp(Math.min(W / 760, H / 480), .5, 1.25);
  VW = W / Z; VH = H / Z; GY = Math.round(VH * .76);
  initSky();
  if (P) { P.x = playerX(); if (P.ground) P.y = GY; }
}

/* ---------------- background ---------------- */
function makeLayer(spd, minH, maxH, minW, maxW, gapMax) {
  const len = Math.max(VW + 500, 1700), items = []; let x = 0;
  while (x < len) {
    const w = rand(minW, maxW), h = rand(minH, maxH);
    items.push({ x, w, h, seed: Math.random() * 1000 | 0, roof: Math.random() * 4 | 0, sign: Math.random() < .22 });
    x += w + rand(2, gapMax);
  }
  return { items, len: x, spd };
}
function makeCloud(x) {
  const s = rand(18, 42), puffs = [];
  for (let i = 0; i < 5; i++) puffs.push([rand(-s * 1.4, s * 1.4), rand(-s * .3, s * .2), rand(s * .45, s * .9)]);
  return { x, y: rand(VH * .05, GY * .42), s, puffs, v: rand(.02, .06), drift: rand(4, 12) };
}
function initSky() {
  sky.far = makeLayer(.14, VH * .14, VH * .36, 36, 90, 10);
  sky.mid = makeLayer(.36, VH * .1, VH * .27, 54, 120, 50);
  sky.stars = Array.from({ length: 120 }, () => ({ x: rand(0, VW), y: rand(0, GY * .72), s: rand(.6, 1.9), p: rand(0, TAU) }));
  sky.clouds = Array.from({ length: 6 }, () => makeCloud(rand(0, VW)));
}
function drawSky() {
  const gr = g.createLinearGradient(0, 0, 0, GY);
  gr.addColorStop(0, rgb(pal.top)); gr.addColorStop(.58, rgb(pal.mid)); gr.addColorStop(1, rgb(pal.bot));
  g.fillStyle = gr; g.fillRect(-40, -40, VW + 80, GY + 50);
  if (pal.stars > .02) {
    for (const s of sky.stars) {
      const a = pal.stars * (.45 + .55 * Math.sin(clock * 2.3 + s.p));
      let x = (s.x - scroll * .006) % VW; if (x < 0) x += VW;
      g.fillStyle = `rgba(255,255,255,${a})`; g.fillRect(x, s.y, s.s, s.s);
    }
  }
  // sun / moon
  const sx = VW * .7, sy = GY * pal.sunY, sr = pal.sunR;
  const gl = g.createRadialGradient(sx, sy, sr * .5, sx, sy, sr * 4.5);
  gl.addColorStop(0, rgba(pal.sun, .55)); gl.addColorStop(1, rgba(pal.sun, 0));
  g.fillStyle = gl; g.fillRect(sx - sr * 5, sy - sr * 5, sr * 10, sr * 10);
  g.fillStyle = rgb(pal.sun); g.beginPath(); g.arc(sx, sy, sr, 0, TAU); g.fill();
  if (pal.bands > .02) {
    g.fillStyle = rgba(pal.bot, pal.bands);
    for (let i = 0; i < 6; i++) { const y = sy + sr * (.1 + i * .16), h = 1.5 + i * 1.3 + Math.sin(clock * 2 + i) * .6; g.fillRect(sx - sr - 2, y, sr * 2 + 4, h); }
  }
  if (pal.stars > .6) { g.fillStyle = rgba(pal.top, .25 * pal.stars); g.beginPath(); g.arc(sx + sr * .35, sy - sr * .2, sr * .85, 0, TAU); g.fill(); }
  // clouds
  for (const c of sky.clouds) {
    g.fillStyle = rgba(pal.cloud, .55);

      for (const s of [-1, 1]) {
        const bw = 14 * Math.abs(Math.sin(clock * 45 + s)) + 3;
        g.fillStyle = 'rgba(200,210,240,.7)'; g.fillRect(cx + s * 20 - bw / 2, cy - 13, bw, 2.5);
      }
      g.fillStyle = '#1a2038'; g.beginPath(); g.ellipse(cx, cy, 18, 9, 0, 0, TAU); g.fill();
      g.strokeStyle = '#ff3d6e'; g.lineWidth = 1.5; g.stroke();
      g.save(); g.globalCompositeOperation = 'lighter';
      const eg = g.createRadialGradient(cx - 7, cy, 0, cx - 7, cy, 12); eg.addColorStop(0, 'rgba(255,255,255,.95)'); eg.addColorStop(.3, 'rgba(255,61,110,.9)'); eg.addColorStop(1, 'rgba(255,61,110,0)');
      g.fillStyle = eg; g.beginPath(); g.arc(cx - 7, cy, 12, 0, TAU); g.fill();
      g.restore();
    }
  }
}
function drawCoins() {
  for (const c of coins) {
    if (c.x > VW + 30 || c.x < -30) continue;
    const s = Math.cos(c.t * 5), w = Math.max(1.5, 9 * Math.abs(s)), y = c.y + Math.sin(c.t * 3) * 2;
    g.save(); g.globalCompositeOperation = 'lighter';
    g.fillStyle = 'rgba(255,207,63,.18)'; g.beginPath(); g.arc(c.x, y, 15, 0, TAU); g.fill();
    g.restore();
    g.fillStyle = s > 0 ? '#ffcf3f' : '#e09a1a'; g.beginPath(); g.ellipse(c.x, y, w, 9, 0, 0, TAU); g.fill();
    g.fillStyle = '#fff3b8'; g.beginPath(); g.ellipse(c.x - w * .25, y - 2, w * .35, 5, 0, 0, TAU); g.fill();
    const sp = (c.t * 1.3) % 2.2;
    if (sp < .3) {
      const k = Math.sin(sp / .3 * Math.PI), sx = c.x + w * .6, sy = y - 6;
      g.fillStyle = `rgba(255,255,255,${k})`; g.beginPath();
      g.moveTo(sx, sy - 7 * k); g.lineTo(sx + 1.5, sy); g.lineTo(sx, sy + 7 * k); g.lineTo(sx - 1.5, sy); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(sx - 7 * k, sy); g.lineTo(sx, sy + 1.5); g.lineTo(sx + 7 * k, sy); g.lineTo(sx, sy - 1.5); g.closePath(); g.fill();
    }
  }
  for (const p of pks) {
    const y = p.y + Math.sin(p.t * 3) * 8, col = p.type === 'M' ? '155,92,255' : '61,224,255';
    g.save(); g.globalCompositeOperation = 'lighter';
    const rg = g.createRadialGradient(p.x, y, 4, p.x, y, 34); rg.addColorStop(0, `rgba(${col},.6)`); rg.addColorStop(1, `rgba(${col},0)`);
    g.fillStyle = rg; g.beginPath(); g.arc(p.x, y, 34, 0, TAU); g.fill();
    g.strokeStyle = `rgba(${col},.9)`; g.lineWidth = 2; g.setLineDash([6, 6]); g.lineDashOffset = -p.t * 30;
    g.beginPath(); g.arc(p.x, y, 20, 0, TAU); g.stroke(); g.setLineDash([]);
    g.restore();
    g.fillStyle = 'rgba(8,18,38,.85)'; g.beginPath(); g.arc(p.x, y, 15, 0, TAU); g.fill();
    g.lineCap = 'butt';
    if (p.type === 'M') {
      g.strokeStyle = '#c39bff'; g.lineWidth = 5; g.beginPath(); g.arc(p.x, y + 1, 7, Math.PI, 0, true); g.stroke();
      g.strokeStyle = '#f3f6ff'; g.beginPath(); g.moveTo(p.x - 7, y + 1); g.lineTo(p.x - 7, y - 5); g.moveTo(p.x + 7, y + 1); g.lineTo(p.x + 7, y - 5); g.stroke();
    } else {
      g.fillStyle = '#3de0ff'; g.beginPath(); g.moveTo(p.x, y - 9); g.lineTo(p.x + 8, y - 5); g.lineTo(p.x + 7, y + 3); g.lineTo(p.x, y + 9); g.lineTo(p.x - 7, y + 3); g.lineTo(p.x - 8, y - 5); g.closePath(); g.fill();
      g.fillStyle = '#081226'; g.fillRect(p.x - 1.2, y - 5, 2.4, 9);
    }
  }
}
function drawParts() {
  for (const p of parts) {
    if (p.delay > 0) continue; const k = Math.max(0, p.life / p.max);
    if (p.t === 'dust') { g.fillStyle = rgba(pal.haze, k * .45); g.beginPath(); g.arc(p.x, p.y, p.size + (1 - k) * p.grow, 0, TAU); g.fill(); }
    else if (p.t === 'debris') { g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.globalAlpha = Math.min(1, k * 2); g.fillStyle = p.col || '#222838'; g.fillRect(-p.size, -p.size / 2, p.size * 2, p.size); g.restore(); }
  }
  g.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    if (p.delay > 0) continue; const k = Math.max(0, p.life / p.max);
    if (p.t === 'spark') { g.strokeStyle = `rgba(${p.col},${k})`; g.lineWidth = p.w; g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x - p.vx * .03, p.y - p.vy * .03); g.stroke(); }
    else if (p.t === 'ring') { g.strokeStyle = `rgba(${p.col},${k})`; g.lineWidth = p.w * k + .5; g.beginPath(); g.arc(p.x, p.y, p.size + (1 - k * k) * p.grow, 0, TAU); g.stroke(); }
    else if (p.t === 'glow') { const r = p.size * (1.15 - k * .15); const rg = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, r); rg.addColorStop(0, `rgba(255,255,255,${k})`); rg.addColorStop(.35, `rgba(${p.col},${k * .8})`); rg.addColorStop(1, `rgba(${p.col},0)`); g.fillStyle = rg; g.beginPath(); g.arc(p.x, p.y, r, 0, TAU); g.fill(); }
  }
  g.globalCompositeOperation = 'source-over';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const p of parts) {
    if (p.t !== 'text') continue; const k = p.life / p.max, age = p.max - p.life;
    const s = age < .12 ? .4 + age / .12 * .9 : 1.3 - Math.min(.3, (age - .12) * 1.5);
    g.save(); g.translate(p.x, p.y); g.scale(s, s); g.globalAlpha = Math.min(1, k * 2.5);
    g.font = `700 ${p.size}px "Chakra Petch", system-ui, sans-serif`;
    g.lineWidth = 4; g.strokeStyle = 'rgba(8,18,38,.8)'; g.strokeText(p.str, 0, 0); g.fillStyle = p.col; g.fillText(p.str, 0, 0);
    g.restore();
  }
}
function drawLines() {
  if (!lines.length) return;
  g.save(); g.globalCompositeOperation = 'lighter'; g.strokeStyle = 'rgba(255,255,255,.35)';
  for (const l of lines) { g.lineWidth = l.w; g.beginPath(); g.moveTo(l.x, l.y); g.lineTo(l.x + l.len, l.y); g.stroke(); }
  g.restore();
}
function drawHUD() {
  g.save();
  const cx = W / 2;
  g.fillStyle = 'rgba(8,18,38,.42)'; g.beginPath();
  if (g.roundRect) g.roundRect(cx - 92, 6, 184, 82, 10); else g.rect(cx - 92, 6, 184, 82);
  g.fill();
  g.textAlign = 'center'; g.textBaseline = 'top';
  g.font = '700 10px "Chakra Petch", system-ui, sans-serif'; g.fillStyle = 'rgba(243,246,255,.6)'; g.fillText('SCORE', cx, 10);
  g.font = '28px Bungee, Impact, sans-serif';
  g.fillStyle = 'rgba(8,18,38,.55)'; g.fillText(Math.floor(dispScore).toLocaleString(), cx + 2, 24);
  g.fillStyle = '#f3f6ff'; g.fillText(Math.floor(dispScore).toLocaleString(), cx, 22);
  g.font = '600 12px "Chakra Petch", system-ui, sans-serif'; g.fillStyle = 'rgba(182,255,61,.95)';
  g.fillText(`${Math.floor(dist)} m  ·  ${Math.round(speed / 40 * 3.6)} km/h`, cx, 56);
  g.fillStyle = 'rgba(255,207,63,.85)'; g.fillText('BEST ' + Math.max(best, score).toLocaleString(), cx, 72);
  // coins (left, under home link)
  const lx = 14, ly = 52;
  g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillStyle = '#ffcf3f'; g.beginPath(); g.ellipse(lx + 8, ly + 8, 7 * Math.abs(Math.cos(clock * 3)) + 1, 7, 0, 0, TAU); g.fill();
  g.font = '700 16px "Chakra Petch", system-ui, sans-serif'; g.fillStyle = '#f3f6ff'; g.fillText(coinsN.toLocaleString(), lx + 22, ly + 9);
  let yy = ly + 26;
  if (P && P.magnetT > 0) {
    g.fillStyle = '#c39bff'; g.font = '700 10px "Chakra Petch", system-ui, sans-serif'; g.fillText('자석', lx, yy);
    g.fillStyle = 'rgba(243,246,255,.18)'; g.fillRect(lx + 30, yy - 2, 60, 4); g.fillStyle = '#9b5cff'; g.fillRect(lx + 30, yy - 2, 60 * P.magnetT / 9, 4); yy += 16;
  }
  if (P && P.shield) { g.fillStyle = '#3de0ff'; g.font = '700 10px "Chakra Petch", system-ui, sans-serif'; g.fillText('실드 ON', lx, yy); }
  if (state === 'play' && runT < 6) {
    g.globalAlpha = Math.min(1, (6 - runT) / 1.2);
    g.textAlign = 'center'; g.font = '600 13px "Chakra Petch", system-ui, sans-serif'; g.fillStyle = '#f3f6ff';
    g.fillText('탭 · Space = 점프 (공중에서 한 번 더)   ↓ · 아래 스와이프 = 슬라이드', cx, H - 34 - (W < 560 ? 16 : 0), W - 24);
    g.globalAlpha = 1;
  }
  g.restore();
}
function render() {
  pal = blendPal(cycleM);
  g.setTransform(DPR * Z, 0, 0, DPR * Z, 0, 0);
  let ox = 0, oy = 0; if (shakeAmt > .3) { ox = rand(-1, 1) * shakeAmt; oy = rand(-1, 1) * shakeAmt; }
  g.save(); g.translate(ox, oy);
  drawSky(); drawMountains(); haze(.35);
  drawLayer(sky.far, pal.far, false); haze(.25);
  drawLayer(sky.mid, pal.mid2, true);
  drawNear(); drawGround();
  drawObs(); drawCoins(); drawPlayer(); drawParts(); drawLines();
  g.restore();
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (flashA > 0) { g.fillStyle = `rgba(${flashCol},${Math.min(.85, flashA * .7)})`; g.fillRect(0, 0, W, H); }
  const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.hypot(W, H) * .6);
  vg.addColorStop(0, 'rgba(4,8,20,0)'); vg.addColorStop(1, 'rgba(4,8,20,.45)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  if (state === 'dying') { g.fillStyle = `rgba(255,61,110,${.12 * Math.min(1, deadT)})`; g.fillRect(0, 0, W, H); }
  if (state === 'play' || state === 'pause' || state === 'dying') drawHUD();
}

/* ---------------- loop ---------------- */
let last = performance.now();
function frame(now) {
  const rdt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  if (state !== 'pause') {
    pollTouches();
    ts = lerp(ts, tsTarget, Math.min(1, rdt * 6));
    shakeAmt *= Math.exp(-rdt * 9); flashA = Math.max(0, flashA - rdt * 2.6);
    if (hitstop > 0) hitstop -= rdt;
    else { const dt = rdt * ts; if (dt > 0) update(dt, rdt); }
  }
  render();
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize();
P = newPlayer();
requestAnimationFrame(frame);
})();
</script>
