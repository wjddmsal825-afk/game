<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Horde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Horde: top-down arena survival. Canvas world + canvas HUD; menus/cards are DOM overlays. Single dark arena look by choice. */
:root{
  --ink:#081226;
  --deep:#0e2244;
  --paper:#f3f6ff;
  --signal:#ffcf3f;
  --hot:#ff3d6e;
  --cool:#3de0ff;
  --acid:#a6ff3d;
  --violet:#9b5cff;
  --ember:#ff8a2b;
  --muted:rgba(243,246,255,.62);
  --display:'Bungee','Impact','Arial Black',system-ui,sans-serif;
  --ui:'Chakra Petch','Avenir Next','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--ui);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:relative;width:100%;height:100%;overflow:hidden;background:#050b18}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#cv.playing{cursor:none}

#home{position:absolute;z-index:30;top:calc(10px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));
  font:700 13px/1 var(--ui);letter-spacing:.06em;color:var(--paper);text-decoration:none;padding:9px 13px;border:1px solid rgba(243,246,255,.3);
  background:rgba(8,18,38,.55);border-radius:6px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:color .15s,border-color .15s,padding .2s,font-size .2s,opacity .2s}
#home:hover{border-color:var(--signal);color:var(--signal)}
#home:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
#home.mini{padding:5px 8px;font-size:11px;opacity:.72}

.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;overflow:hidden;
  padding-block:56px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  text-align:center;background:radial-gradient(ellipse at 50% 45%,rgba(8,18,38,.15),rgba(8,18,38,.82));animation:fadeIn .4s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.eyebrow{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--acid);font-weight:700}
.logo-wrap{position:relative}
.logo-wrap::before{content:"";position:absolute;left:50%;top:50%;width:min(78vw,420px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:conic-gradient(from 0deg,transparent,rgba(166,255,61,.35),transparent 30%,rgba(155,92,255,.35),transparent 60%,rgba(255,61,110,.35),transparent 90%);
  -webkit-mask:radial-gradient(circle,transparent 54%,#000 56%,#000 60%,transparent 62%);mask:radial-gradient(circle,transparent 54%,#000 56%,#000 60%,transparent 62%);
  animation:spin 9s linear infinite;pointer-events:none}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.logo{position:relative;font-family:var(--display);font-size:clamp(56px,16vw,128px);line-height:.92;letter-spacing:.02em;margin:0;white-space:nowrap}
.logo span{display:inline-block;background:linear-gradient(180deg,#fff 6%,var(--acid) 48%,var(--violet) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 5px 0 rgba(4,10,24,.6)) drop-shadow(0 0 18px rgba(166,255,61,.25));
  animation:burst .8s cubic-bezier(.2,1.5,.4,1) both, wob 2.4s ease-in-out infinite;
  animation-delay:calc(var(--i)*80ms), calc(var(--i)*150ms + .9s)}
@keyframes burst{from{transform:scale(0) rotate(calc(var(--i)*40deg - 80deg));opacity:0}to{transform:none;opacity:1}}
@keyframes wob{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-6px) rotate(-3deg)}60%{transform:translateY(2px) rotate(2deg)}}
.tag{max-width:36ch;margin:0;color:var(--muted);font-size:15px;line-height:1.5;text-wrap:balance}

.btn{font-family:var(--display);font-size:20px;letter-spacing:.04em;color:var(--ink);background:var(--acid);border:0;cursor:pointer;
  padding:16px 38px;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);position:relative;overflow:hidden;
  transition:transform .15s ease, background .15s ease}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.75) 48%,transparent 66%);transform:translateX(-120%);animation:shine 2.6s ease-in-out infinite 1.2s}
@keyframes shine{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.btn:hover{transform:translateY(-2px) scale(1.04);background:#c4ff7a}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid var(--cool);outline-offset:4px}

.keys{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;max-width:560px;font-size:13px;color:var(--muted)}
.keys b{display:inline-block;min-width:22px;padding:2px 7px;margin-right:4px;border:1px solid rgba(243,246,255,.28);border-bottom-width:3px;border-radius:4px;color:var(--paper);font-weight:600;font-size:12px}
.best{font-size:13px;letter-spacing:.2em;color:var(--signal);font-variant-numeric:tabular-nums}

#over h2{font-family:var(--display);font-size:clamp(38px,10vw,72px);margin:0;color:var(--hot);letter-spacing:.02em;animation:slam .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slam{from{transform:scale(2.4);opacity:0;filter:blur(6px)}to{transform:none;opacity:1;filter:none}}
.score-big{font-family:var(--display);font-size:clamp(40px,11vw,76px);color:var(--paper);font-variant-numeric:tabular-nums;line-height:1}
.newrec{font-weight:700;letter-spacing:.24em;font-size:13px;color:var(--ink);background:var(--acid);padding:5px 12px;animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 26px;font-size:13px;color:var(--muted);letter-spacing:.12em}
.stats strong{display:block;font-size:22px;color:var(--paper);letter-spacing:0;font-variant-numeric:tabular-nums}

#banner{position:absolute;left:0;right:0;top:28%;pointer-events:none;text-align:center;opacity:0;z-index:5}
#banner.show{animation:bannerLife 2.7s ease both}
#banner .b-main{font-family:var(--display);font-size:clamp(36px,10vw,78px);color:var(--paper);text-shadow:0 4px 0 rgba(4,10,24,.6);white-space:nowrap}
#banner .b-main span{display:inline-block;animation:letterIn .5s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i)*45ms)}
#banner .b-sub{font-weight:700;letter-spacing:.3em;font-size:14px;color:var(--acid);margin-top:6px}
#banner::before,#banner::after{content:"";display:block;height:3px;margin:10px auto;background:linear-gradient(90deg,transparent,var(--acid),transparent);animation:stretch .7s ease both .1s}
@keyframes stretch{from{width:0}to{width:min(520px,80%)}}
@keyframes letterIn{from{transform:translateY(40px) skewX(-20deg);opacity:0}to{transform:none;opacity:1}}
@keyframes bannerLife{0%{opacity:0;transform:scaleY(.4)}8%{opacity:1;transform:none}82%{opacity:1;transform:none}100%{opacity:0;transform:translateX(60px)}}
#banner.warn .b-main{color:var(--hot);animation:warnBlink .35s steps(2) infinite}
#banner.warn .b-sub{color:var(--hot)}
#banner.warn::before,#banner.warn::after{height:16px;background:repeating-linear-gradient(-45deg,var(--hot) 0 14px,transparent 14px 28px);background-size:40px 16px;animation:stretch .5s ease both, hazard .6s linear infinite}
#banner.gold .b-main{color:var(--signal)}
@keyframes hazard{to{background-position:40px 0}}
@keyframes warnBlink{50%{opacity:.35}}

#hudBtns{position:absolute;inset:0;pointer-events:none;z-index:6}
.hb{pointer-events:auto;position:absolute;border:1px solid rgba(243,246,255,.3);background:rgba(8,18,38,.5);color:var(--paper);font-family:var(--ui);font-weight:700;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.hb:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
#pauseBtn,#muteBtn{top:calc(10px + env(safe-area-inset-top,0px));height:30px;min-width:42px;padding:0 9px;border-radius:6px;font-size:11px;letter-spacing:.08em}
#pauseBtn{right:calc(12px + env(safe-area-inset-right,0px))}
#muteBtn{right:calc(60px + env(safe-area-inset-right,0px))}
#dashBtn{right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:78px;height:78px;border-radius:50%;
  font-family:var(--display);font-size:14px;border:2px solid var(--acid);color:var(--acid);box-shadow:0 0 0 5px rgba(166,255,61,.14),0 0 24px rgba(166,255,61,.25);overflow:hidden;--cd:0}
#dashBtn::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(5,11,24,.78) calc(var(--cd)*360deg),transparent 0)}
#dashBtn span{position:relative}
#dashBtn:active{transform:scale(.92)}
#pause h2{font-family:var(--display);font-size:44px;margin:0}

/* level up */
#lvl{gap:14px;background:radial-gradient(ellipse at 50% 50%,rgba(8,18,38,.35),rgba(8,18,38,.88))}
#lvl::before{content:"";position:absolute;left:50%;top:42%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;
  background:repeating-conic-gradient(from 0deg,rgba(255,207,63,.13) 0 5deg,transparent 5deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 32%);mask:radial-gradient(circle,#000 0,transparent 32%);animation:rays 16s linear infinite;pointer-events:none}
@keyframes rays{to{transform:rotate(360deg)}}
#lvl > *{position:relative}
.lv-title{font-family:var(--display);font-size:clamp(40px,11vw,80px);line-height:1;color:var(--signal);text-shadow:0 5px 0 rgba(4,10,24,.6),0 0 30px rgba(255,207,63,.45)}
.lv-title span{display:inline-block;animation:lvPop .55s cubic-bezier(.2,1.7,.4,1) both;animation-delay:calc(var(--i)*40ms)}
@keyframes lvPop{from{transform:scale(0) translateY(30px) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
.lv-sub{font-weight:700;letter-spacing:.24em;font-size:12px;color:var(--muted)}
#cards{display:grid;grid-template-columns:repeat(3,minmax(0,210px));gap:16px;perspective:900px;margin-top:6px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 16px 18px;min-height:230px;
  background:linear-gradient(180deg,rgba(22,38,78,.96),rgba(8,18,38,.97));border:2px solid var(--c);color:var(--paper);font-family:var(--ui);cursor:pointer;border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.4),0 0 26px -6px var(--c);animation:cardIn .65s cubic-bezier(.2,1.35,.4,1) both;animation-delay:calc(var(--i)*120ms + .15s);
  transition:transform .15s ease, box-shadow .15s ease;overflow:hidden;text-align:center}
@keyframes cardIn{from{transform:translateY(90px) rotateY(85deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);transform:translateX(-130%);animation:shine 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*.25s + .9s);pointer-events:none}
.card:hover,.card:focus-visible{transform:translateY(-7px) scale(1.04);box-shadow:0 16px 36px rgba(0,0,0,.5),0 0 44px -2px var(--c);outline:none}
.card .key{position:absolute;top:8px;left:10px;font:700 11px/1 var(--ui);color:var(--c);border:1px solid var(--c);border-radius:4px;padding:3px 6px;opacity:.85}
.card .tagn{position:absolute;top:8px;right:10px;font:700 10px/1 var(--ui);letter-spacing:.14em;color:var(--ink);background:var(--c);padding:4px 6px;border-radius:3px}
.card .ic{width:66px;height:66px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:30px;color:var(--c);border:2px solid var(--c);
  background:radial-gradient(circle,rgba(255,255,255,.12),rgba(255,255,255,0) 70%);animation:icSpin 1s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i)*120ms + .35s)}
@keyframes icSpin{from{transform:rotate(-200deg) scale(.2)}to{transform:none}}
.card .txt{display:flex;flex-direction:column;gap:6px;align-items:center}
.card .nm{font-family:var(--display);font-size:17px;letter-spacing:.02em;color:var(--paper)}
.card .ds{font-size:13px;line-height:1.45;color:var(--muted)}
.card .pips{display:flex;gap:4px;margin-top:2px}
.card .pips i{width:12px;height:5px;background:rgba(243,246,255,.18);transform:skewX(-20deg)}
.card .pips i.on{background:var(--c)}
.card .pips i.nx{background:var(--paper);animation:warnBlink .5s steps(2) infinite}
@media (max-width:660px){
  #cards{grid-template-columns:1fr;width:min(380px,100%);gap:10px}
  .card{flex-direction:row;min-height:0;padding:14px 14px 14px 16px;text-align:left;gap:14px}
  .card .ic{width:50px;height:50px;font-size:23px}
  .card .txt{align-items:flex-start}
  .card .key{top:auto;bottom:6px;left:auto;right:8px}
  @keyframes cardIn{from{transform:translateX(-60px) rotateX(70deg) scale(.7);opacity:0}to{transform:none;opacity:1}}
}
@media (max-height:520px){ .card{min-height:0;padding-top:20px} .card .ic{width:44px;height:44px;font-size:20px} }

@media (prefers-reduced-motion: reduce){
  .logo span,.btn::after,#banner .b-main span,.newrec,#banner.warn .b-main,.logo-wrap::before,#lvl::before,.card::after,.card .pips i.nx{animation:none!important}
  .card,.card .ic,.lv-title span{animation-duration:.01s!important;animation-delay:0s!important}
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" aria-label="게임 화면"></canvas>
  <div id="banner"></div>

  <div id="hudBtns" hidden>
    <button class="hb" id="pauseBtn" aria-label="일시정지">II</button>
    <button class="hb" id="muteBtn" aria-label="소리 끄기">SND</button>
    <button class="hb" id="dashBtn" aria-label="대시" hidden><span>DASH</span></button>
  </div>

  <div id="menu" class="overlay">
    <div class="eyebrow">Arena Survival · 무한 생존 사격전</div>
    <div class="logo-wrap"><h1 class="logo" aria-label="Horde"></h1></div>
    <p class="tag">사방에서 몰려오는 무리를 버텨내세요. 경험치 결정을 모아 레벨업하고, 강화 카드로 나만의 무기를 완성하세요. 5웨이브마다 보스가 등장합니다.</p>
    <button class="btn" id="startBtn">출격하기</button>
    <div class="keys">
      <span><b>WASD</b>/<b>←↑↓→</b> 이동</span>
      <span><b>마우스</b> 조준 · 자동 사격</span>
      <span><b>Space</b>/<b>Shift</b> 대시</span>
      <span><b>1</b><b>2</b><b>3</b> 강화 선택</span>
      <span><b>P</b> 일시정지</span>
      <span>터치: 왼쪽 스틱 · 자동 조준</span>
    </div>
    <div class="best" id="bestLbl"></div>
  </div>

  <div id="lvl" class="overlay" hidden>
    <div class="lv-title" aria-label="Level up"></div>
    <div class="lv-sub" id="lvSub">강화 하나를 선택하세요 · 1 / 2 / 3</div>
    <div id="cards"></div>
  </div>

  <div id="pause" class="overlay" hidden>
    <h2>PAUSED</h2>
    <button class="btn" id="resumeBtn">계속하기</button>
  </div>

  <div id="over" class="overlay" hidden>
    <div class="eyebrow" style="color:var(--hot)">포위당했습니다</div>
    <h2>OVERRUN</h2>
    <div class="score-big" id="overScore">0</div>
    <div class="newrec" id="newRec" hidden>NEW RECORD</div>
    <div class="stats">
      <div>도달 웨이브<strong id="overWave">1</strong></div>
      <div>처치<strong id="overKills">0</strong></div>
      <div>레벨<strong id="overLv">1</strong></div>
      <div>최고 기록<strong id="overBest">0</strong></div>
    </div>
    <button class="btn" id="retryBtn">다시 도전</button>
  </div>

  <a id="home" href="../index.html">◀ 홈</a>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const $ = id => document.getElementById(id);
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const d2 = (a, b, c, d) => { const x = a - c, y = b - d; return x * x + y * y; };
const angLerp = (a, b, t) => { const da = ((b - a + Math.PI * 3) % TAU) - Math.PI; return a + da * t; };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const pad = n => String(Math.floor(n)).padStart(7, '0');
const letters = (s) => [...s].map((c, i) => `<span style="--i:${i}">${c === ' ' ? '&nbsp;' : c}</span>`).join('');

$('menu').querySelector('.logo').innerHTML = letters('HORDE');
document.querySelector('.lv-title').innerHTML = letters('LEVEL UP');

/* ---------------- audio ---------------- */
const S = {
  ctx: null, m: null, muted: store.get('arcade-horde-muted', '0') === '1', ls: 0, lh: 0, lp: 0, lg: 0, gch: 0, lsp: 0,
  init() {
    if (this.ctx) { this.ctx.resume && this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = new AC(); this.m = this.ctx.createGain(); this.m.gain.value = .3; this.m.connect(this.ctx.destination);
      const sr = this.ctx.sampleRate; this.nb = this.ctx.createBuffer(1, sr * 1.5, sr);
      const d = this.nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  ok() { return this.ctx && !this.muted; },
  tone(f, dur, type = 'square', vol = .1, f2 = null, delay = 0) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime + delay, o = c.createOscillator(), gn = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(gn); gn.connect(this.m); o.start(t); o.stop(t + dur + .02);
  },
  noise(dur, vol, f1, f2) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime, s = c.createBufferSource(); s.buffer = this.nb;
    const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.setValueAtTime(f1, t); fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const gn = c.createGain(); gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(fl); fl.connect(gn); gn.connect(this.m); s.start(t); s.stop(t + dur);
  },
  thr(key, ms) { const n = performance.now(); if (n - this[key] < ms) return false; this[key] = n; return true; },
  shot() { if (this.thr('ls', 80)) this.tone(rand(900, 1100), .05, 'square', .016, 380); },
  hit() { if (this.thr('lh', 45)) this.tone(260, .04, 'triangle', .045, 140); },
  pop() { if (this.thr('lp', 35)) { this.tone(rand(420, 700), .08, 'triangle', .06, 120); this.noise(.08, .05, 2600, 400); } },
  gem() { if (!this.thr('lg', 38)) return; this.gch = Math.min(24, this.gch + 1); this.tone(880 + this.gch * 45, .06, 'sine', .045); },
  boom(s = 1) { s = Math.min(s, 2.5); this.noise(.3 + s * .25, .26 * Math.min(1.4, s), 2000, 50); this.tone(120, .25 + s * .1, 'sine', .2 * Math.min(1.3, s), 35); },
  dash() { this.noise(.22, .18, 4200, 300); this.tone(260, .16, 'sawtooth', .035, 900); },
  hurt() { this.tone(240, .35, 'sawtooth', .11, 50); this.noise(.3, .22, 2600, 90); },
  warn() { for (let i = 0; i < 4; i++) this.tone(460, .28, 'sawtooth', .07, 300, i * .55); },
  spit() { if (this.thr('lsp', 90)) this.tone(380, .12, 'square', .025, 160); },
  charge() { this.tone(160, .7, 'sawtooth', .03, 560); },
  nova() { this.tone(220, .45, 'sine', .14, 55); this.noise(.35, .12, 1500, 80); },
  level() { [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, .2, 'square', .045, null, i * .07)); this.tone(1568, .5, 'triangle', .05, null, .35); },

}
function drawParts() {

    else if (p.t === 'ghost') { g.save(); g.translate(p.x, p.y); g.fillStyle = `rgba(166,255,61,${k * .45})`; hexPath(15 + (1 - k) * 4, clock * .6 - p.ang); g.fill(); g.restore(); }

      for (let i = 0; i < 16; i++) { const a = i / 16 * TAU; g.moveTo(0, 0); g.lineTo(Math.cos(a - .07) * R, Math.sin(a - .07) * R); g.lineTo(Math.cos(a + .07) * R, Math.sin(a + .07) * R); }
      g.fill(); g.restore();

  }
  g.globalCompositeOperation = 'source-over';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const p of parts) {
    if (p.t !== 'text') continue; const k = p.life / p.max, age = p.max - p.life;
    const s = age < .12 ? .4 + age / .12 * .9 : 1.3 - Math.min(.3, (age - .12) * 1.5);

    g.font = `700 ${p.size}px "Chakra Petch", system-ui, sans-serif`;
    g.lineWidth = 4; g.strokeStyle = 'rgba(8,18,38,.85)'; g.strokeText(p.str, 0, 0); g.fillStyle = p.col; g.fillText(p.str, 0, 0);

}
const FONT = (w, s) => `${w} ${s}px "Chakra Petch", system-ui, sans-serif`;
function drawHUD() {
  g.save(); g.textBaseline = 'top'; g.textAlign = 'left';

  g.fillStyle = 'rgba(243,246,255,.15)'; g.fillRect(dx0 + 32, hy + 37, 46, 5); g.fillStyle = dk >= 1 ? '#a6ff3d' : 'rgba(166,255,61,.6)'; g.fillRect(dx0 + 32, hy + 37, 46 * dk, 5);

  g.textAlign = 'center'; g.font = '16px Bungee, Impact, sans-serif'; g.fillStyle = bossWave ? '#ff3d6e' : '#f3f6ff'; g.fillText('WAVE ' + wave, W / 2, 12);

  g.fillStyle = 'rgba(243,246,255,.14)'; g.fillRect(tx, 34, tw, 3);

    const rem = Math.max(0, WAVE_LEN - waveT); g.fillStyle = rem < 5 ? '#a6ff3d' : 'rgba(61,224,255,.85)'; g.fillRect(tx, 34, tw * (1 - rem / WAVE_LEN), 3);
    g.font = FONT(700, 11); g.fillStyle = 'rgba(243,246,255,.7)'; g.fillText(`0:${String(Math.ceil(rem)).padStart(2, '0')}`, W / 2, 41);

    g.textAlign = 'left'; g.textBaseline = 'bottom'; g.font = '13px Bungee, Impact, sans-serif'; g.fillStyle = '#ff3d6e'; g.fillText(boss.name, bx, yy - 4);
    g.fillStyle = 'rgba(8,18,38,.75)'; g.fillRect(bx - 2, yy - 2, bw + 4, 12);

}
function drawControls() {
  if (stick) {

    g.beginPath(); g.arc(stick.ox, stick.oy, 56, 0, TAU); g.fill(); g.stroke();

function render() {

}

/* ---------------- loop ---------------- */
let last = performance.now();
function frame(now) {
  const rdt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
